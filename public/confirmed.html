<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email Confirmed · CALABARZON Virtual Tour</title>
  <style>
    :root { --taal:#0E3B43; --gold:#D9A441; --paper:#F5F6F1; --ink:#1D2A2E; --muted:#5C6A6D; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--taal); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px;
    }
    .card {
      background: var(--paper); border: 1.5px solid var(--gold); border-radius: 16px;
      padding: 32px 24px; max-width: 420px; width: 100%; text-align: center;
    }
    .check {
      width: 64px; height: 64px; border-radius: 50%; background: var(--gold); color: var(--taal);
      font-size: 34px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
    }
    h1 { font-family: Georgia, "Times New Roman", serif; color: var(--ink); margin: 0 0 8px; font-size: 26px; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
    a.btn {
      display: inline-block; background: var(--taal); color: #fff; text-decoration: none;
      padding: 14px 28px; border-radius: 10px; font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Email confirmed</h1>
    <p>Your account is ready. Go back to the app and log in with your email and password.</p>
    <a class="btn" href="/">Open the app</a>
  </div>
</body>
</html>
